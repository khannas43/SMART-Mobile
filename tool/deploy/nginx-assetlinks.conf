# Nginx — serve Android App Links verification at domain root (VAPT HIGH).
# Place in server block for smart.rajasthan.gov.in / smarttest.rajasthan.gov.in
# BEFORE the generic location / proxy to Next.js.

location = /.well-known/assetlinks.json {
    default_type application/json;
    add_header Cache-Control "public, max-age=3600";
    # Production host:
    alias /var/www/smart/.well-known/assetlinks.json;
    # UAT host — use assetlinks-uat.json renamed to assetlinks.json on disk.
}

