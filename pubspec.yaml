name: smart_rajasthan
description: SMART - Services Management with Artificial Intelligence and Real Time system, Government of Rajasthan

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  flutter_custom_tabs: ^2.1.0
  webview_flutter: ^4.10.0
  app_links: ^6.3.3
  encrypt: ^5.0.3
  shared_preferences: ^2.5.3
  safe_device: ^1.1.7
  pdfrx: ^2.4.7
  path_provider: ^2.1.6
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1
  http_mock_adapter: ^0.6.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/icon/icon_foreground.png
    - assets/SMART_Mobile_Application_User_Manual_V1.0.pdf
    - assets/.well-known/assetlinks.json
    - assets/.well-known/assetlinks-uat.json
